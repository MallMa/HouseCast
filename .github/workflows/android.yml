name: Android

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the rolling preview release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Housecast-android-preview.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Housecast-android-preview
          path: ${{ runner.temp }}/Housecast-android-preview.apk
      # One rolling pre-release, replaced by every build, so the newest APK
      # always has the same download link. It is never marked "latest".
      - name: Publish preview release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-preview --cleanup-tag --yes || true
          gh release create android-preview "$RUNNER_TEMP/Housecast-android-preview.apk" \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Housecast for Android (preview build ${GITHUB_RUN_NUMBER})" \
            --notes "Automated preview build of the Android app from \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}). Not a stable release: expect rough edges. Download the APK below on your phone and open it to install. See android/README.md."
